  # firmware:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #       with:
  #         targets: thumbv7em-none-eabihf
  #     - run: cd firmware && cargo build --release --bin bench
