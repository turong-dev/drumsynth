[package]
name = "mi-drum-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mutable-Instruments-based drum device: Plaits + Peaks voices over device-core."

[dependencies]
libm = "0.2"
device-core = { path = "../../core" }
mi-dsp = { path = "../../mi-dsp" }

[dev-dependencies]
approx = "0.5"

[features]
default = []
debug-params = []
grid = ["device-core/grid"]

[[bench]]
name = "mi_drum"
harness = false

