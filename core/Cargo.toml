[package]
name = "device-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared no_std/no_alloc core for synth devices: DSP, macros, MIDI parser, timing."

[dependencies]
# The only dependency. Deliberately: every crate added here has to survive
# `--target thumbv7em-none-eabihf`, so the bar is high.
libm = "0.2"

[dev-dependencies]
# Host-only, for tests. Never leaks into the target build.
approx = "0.5"

[features]
default = []
# Enable to get #[derive(Debug)] on parameter structs. Costs code size on
# target, useful when poking at things from the host renderer.
debug-params = []
# Enable the Monome Grid / midigrid control surface integration.
grid = []
