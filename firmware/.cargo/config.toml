[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
rustflags = [
    # our build.rs supplies this. It places code in ITCM and
    # data in DTCM, which is what gets you the full 600MHz without stalling on
    # flash reads. If your cycle counts look implausibly bad, check this is
    # actually being applied.
    # Our own script (firmware/build.rs), not the BSP's `t4link.x`. Same memory
    # map except the FlexRAM split: ITCM 8 / DTCM 8 rather than 6 / 10, because
    # the Plaits C++ makes ITCM the binding constraint while DTCM sits half
    # empty. See build.rs for the numbers.
    "-C", "link-arg=-Tdrumsynth-link.x",

    # The target's default CPU model is generic thumbv7em, which implies
    # fpv4-sp-d16 -- single precision only, and a scheduling model that is not
    # the M7's. The i.MX RT1062 is a Cortex-M7 with FPv5-D16 and a dual-issue
    # pipeline. Without this, LLVM emits zero fused multiply-adds for the whole
    # engine (435 chained vmla/vmls instead), and `mi-dsp/build.rs` has been
    # compiling its C++ with `-mcpu=cortex-m7 -mfpu=fpv5-d16` all along, so the
    # two halves of the image disagreed about the FPU.
    #
    # `core` and `libm` stay as the generic prebuilt rlibs -- rebuilding them
    # for this CPU needs `-Z build-std`, which needs nightly. Mixing is
    # ABI-compatible: the float ABI and register count are unchanged.
    "-C", "target-cpu=cortex-m7",
]

# There is no `cargo run` story here by default: the Teensy bootloader wants a
# HEX file, not an ELF, and flashing goes through teensy_loader_cli or the
# Teensy Loader GUI.
#
# Once you have cargo-binutils installed (`cargo install cargo-binutils` plus
# `rustup component add llvm-tools-preview`), the loop is:
#
#     cargo build --release --bin bench
#     rust-objcopy -O ihex target/thumbv7em-none-eabihf/release/bench bench.hex
#     teensy_loader_cli --mcu=TEENSY41 -w -v bench.hex
#
# See flash.sh in this directory, which wraps that up.
[alias]
bench-build = "build --release --bin bench"
