[package]
name = "firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Teensy 4.1 target for drum-engine."

[features]
default = ["grid"]
grid = ["drum-engine/grid"]

# The Plaits device. Off by default because `mi-dsp` cross-compiles vendored
# C++ and so needs a bare-metal C++ toolchain (`arm-none-eabi-g++`, or set
# `MI_DSP_CXX`). Apple's clang++ cannot do it — it has no `<new>` for a
# `thumbv7em-none-eabihf` target. Neither `bench` nor `drum` needs any of
# that, and they should not be unbuildable without it.
mi-drum = ["dep:mi-drum-engine"]

# NOTE ON VERSIONS
#
# teensy4-bsp 0.6.0 bundles imxrt-hal 0.6.0, which is where the SAI driver
# landed (26 July 2026). Everything below that pinned on the usb-device 0.2
# wall (imxrt-usbd 0.2, usb-device 0.2, usbd-serial 0.1, imxrt-log 0.1) moved
# with it: bsp 0.6 → imxrt-usbd 0.4 → usb-device 0.3. Bump all of it together.
#
# Check what the BSP pins before touching anything else:
#
#     cargo tree -p firmware | grep imxrt-hal

[dependencies]
drum-engine = { path = "../devices/drum" }
mi-drum-engine = { path = "../devices/mi-drum", optional = true }

teensy4-bsp = { version = "0.6", features = ["rt"] }
teensy4-panic = "0.3"
cortex-m = "0.7"
cortex-m-rt = "0.7"
# Brings `embedded_hal::serial::Read` into scope so the LPUART `read()`
# method resolves — imxrt-hal 0.5 implements the 0.2 traits.
embedded-hal = "0.2"

# Logging over USB serial rather than RTT.
#
# The Teensy 4.1 has SWD pads on the underside but no populated header, so
# probe-rs and defmt-over-RTT are awkward here in a way they are not on a
# Daisy. USB CDC is the idiomatic Teensy route and needs no extra hardware:
# flash, then `screen /dev/ttyACM0 115200` or equivalent.
imxrt-log = { version = "0.2", default-features = false, features = ["log", "usbd"] }
log = "0.4"

# USB MIDI device (Phase 8-M). The main binary builds its own USB stack (see
# firmware/src/usb.rs) rather than imxrt-log's, which owns its entire stack
# and cannot host a second class on the one bus the Teensy has.
#
# The MIDI class is vendored (~150 lines) rather than pulled from `usbd-midi`.
# The version wall that forced that is gone with the bsp 0.6 move (usb-device
# is now 0.3 everywhere), but the vendored class is byte-for-byte the layout
# usbd-midi 0.5.1 emits and it saves a dependency that brings nothing new.
#
# `usb-device` is the one direct dependency: `BusAdapter` and friends come
# through `bsp::hal::usbd`, which re-exports the imxrt-hal (and therefore
# imxrt-usbd) types the BSP itself pins. Depending on them directly would
# risk two versions of the same crate in the tree.
usb-device = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2          # symbols cost nothing in flash and make disassembly readable
overflow-checks = false
panic = "abort"

# Always build the engine optimised, even in a debug firmware build.
# An unoptimised DSP inner loop on an M7 is slow enough to be misleading —
# you will conclude you are over budget when you are not.
[[bin]]
name = "mi-drum"
required-features = ["mi-drum"]

[profile.dev.package.drum-engine]
opt-level = 3

[profile.dev.package.mi-drum-engine]
opt-level = 3

[profile.dev]
opt-level = 1
debug = 2
