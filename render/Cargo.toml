[package]
name = "render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host-side renderer. Auditions the engine without any hardware."

[dependencies]
drum-engine = { workspace = true, features = ["debug-params"] }
hound = "3.5"
clap = { version = "4", features = ["derive"] }

# Live playback. Optional because it drags in an OS audio stack, and on a
# headless CI box you only want the WAV path. `midir` + `rtrb` power the
# `device` mode (virtual MIDI input + a real-time queue to the audio thread).
cpal = { version = "0.15", optional = true }
midir = { version = "0.11", optional = true }
rtrb = { version = "0.3", optional = true }
ctrlc = { version = "3.4", optional = true }

[features]
default = []
# cargo run --features live -- play
# cargo run --features live -- device
# cargo run --features live -- monitor
live = ["dep:cpal", "dep:midir", "dep:rtrb", "dep:ctrlc"]

# The device-mode integration test exercises real CoreMIDI virtual ports, so
# it needs the live stack.
[[test]]
name = "device"
required-features = ["live"]
