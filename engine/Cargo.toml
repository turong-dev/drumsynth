[package]
name = "drum-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hardware-free drum synthesis engine. no_std, no alloc, f32 only."

[dependencies]
# The only dependency. Deliberately: every crate added here has to survive
# `--target thumbv7em-none-eabihf`, so the bar is high.
#
# libm gives us sinf/expf/powf, which core does not. See dsp::fast for the
# cheaper approximations used in the per-sample hot path.
libm = "0.2"

[dev-dependencies]
# Host-only, for tests. Never leaks into the target build.
approx = "0.5"

[features]
default = []
# Enable to get #[derive(Debug)] on parameter structs. Costs code size on
# target, useful when poking at things from the host renderer.
debug-params = []
